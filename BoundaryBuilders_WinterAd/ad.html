<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Boundary Builders Winter Sale ad template</title>
<style>
@font-face{font-family:'Outfit';src:url('Outfit-500.woff2') format('woff2');font-weight:100 900;font-display:block;}
html,body{margin:0;padding:0;background:#000;}
#stage{position:relative;width:1080px;height:1920px;overflow:hidden;background:#020101;font-family:'Outfit',sans-serif;color:#F9F9F9;-webkit-font-smoothing:antialiased;}
#stage *{box-sizing:border-box;}
.scene{position:absolute;left:0;top:0;width:100%;height:100%;overflow:hidden;}
img.fill{position:absolute;left:0;top:0;width:100%;height:100%;object-fit:cover;filter:blur(26px) brightness(.48) saturate(1.1);transform-origin:50% 50%;}
.vigTop{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(to bottom, rgba(0,0,0,.55) 0%, rgba(0,0,0,0) 22%);}
.vigBot{position:absolute;left:0;top:0;width:100%;height:100%;background:linear-gradient(to top, rgba(0,0,0,.6) 0%, rgba(0,0,0,0) 30%);}
.band{position:absolute;left:0;width:1080px;overflow:hidden;box-shadow:0 18px 60px rgba(0,0,0,.5);}
.band img.sharp{position:absolute;left:0;top:0;filter:saturate(1.08) contrast(1.04);}
.txt{position:absolute;left:65px;width:950px;text-align:center;font-weight:900;line-height:1.04;letter-spacing:-1px;text-shadow:0 6px 30px rgba(0,0,0,.7), 0 2px 8px rgba(0,0,0,.6);}
.txt .line{display:block;white-space:nowrap;transform-origin:50% 50%;}
.gold{color:#FFC527;}
.sale .line{text-transform:uppercase;letter-spacing:2px;color:#FFC527;}
.bar{position:absolute;height:10px;border-radius:5px;background:#FFC527;transform-origin:left center;}
.end{background:radial-gradient(ellipse 70% 50% at 50% 42%, #1c1b1a 0%, #0a0908 55%, #020101 100%);}
.logo{position:absolute;left:0;width:1080px;text-align:center;transform-origin:50% 50%;}
.logo img{display:inline-block;}
.cta{position:absolute;left:50%;display:inline-block;background:#FFC527;color:#111;font-weight:900;line-height:1;padding:26px 52px 22px;border-radius:999px;white-space:nowrap;box-shadow:0 14px 40px rgba(0,0,0,.5);transform-origin:50% 50%;}
#wipe{position:absolute;left:0;top:0;width:1080px;height:100%;background:#FFC527;}
#wipe:after{content:"";position:absolute;left:0;top:-140px;width:1080px;height:140px;background:#020101;}
#measure{position:absolute;left:-6000px;top:0;visibility:hidden;white-space:nowrap;}
</style>
</head>
<body>
<div id="stage">
  <div id="scenes"></div>
  <div id="wipe"></div>
  <div id="measure"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const EO  = t => 1 - Math.pow(1 - t, 3);
const EIO = t => t < .5 ? 4*t*t*t : 1 - Math.pow(-2*t + 2, 3) / 2;
const EOB = t => { const c = 1.70158; return 1 + (c + 1) * Math.pow(t - 1, 3) + c * Math.pow(t - 1, 2); };
const EOX = t => t >= 1 ? 1 : 1 - Math.pow(2, -10 * t);
const LIN = t => t;
window.FIT_WARNINGS = []; window.STRINGS = []; window.SCENES = [];
const items = []; const byEl = new Map();
function reg(el, base) { const it = { el, base: Object.assign({ o: 1, x: 0, y: 0, s: 1, sx: 1 }, base || {}), tws: [] }; items.push(it); byEl.set(el, it); return it; }
function tw(el, t0, t1, to, ease, from) { (byEl.get(el) || reg(el)).tws.push({ t0, t1, to, ease: ease || EO, from }); }
function seek(t) {
  for (const it of items) {
    const p = Object.assign({}, it.base);
    for (const w of it.tws) {
      if (t < w.t0) continue;
      const from = Object.assign({}, p, w.from || {});
      let k = w.t1 > w.t0 ? Math.min(1, (t - w.t0) / (w.t1 - w.t0)) : 1; k = w.ease(k);
      for (const key in w.to) p[key] = from[key] + (w.to[key] - from[key]) * k;
    }
    const s = it.el.style;
    s.opacity = Math.max(0, Math.min(1, p.o)); s.visibility = p.o <= 0.001 ? 'hidden' : 'visible';
    if (it.kb) {   // Ken Burns as layout: the image is resampled at its exact on-screen size every frame
      const w = it.kb.w * p.s, h = it.kb.h * p.s;
      s.width = w.toFixed(3) + 'px'; s.height = h.toFixed(3) + 'px'; s.left = (it.kb.cx - w / 2 + p.x).toFixed(3) + 'px'; s.top = (it.kb.cy - h / 2 + p.y).toFixed(3) + 'px'; s.transform = 'none';
    } else s.transform = 'translate(' + (it.base.tx || 0) + ') translate(' + p.x.toFixed(2) + 'px,' + p.y.toFixed(2) + 'px) scale(' + (p.s * p.sx).toFixed(4) + ',' + p.s.toFixed(4) + ')';
  }
  window.CUR_T = t;
}
function el(tag, cls, parent) { const e = document.createElement(tag); if (cls) e.className = cls; if (parent) parent.appendChild(e); return e; }
let F = null, S = null, W = 1080, H = 1920;

/* ---------- text fitting: largest size whose line count and block height fit the zone ---------- */
function measureW(text, sz, cls) { const m = $('measure'); m.innerHTML = ''; const d = el('div', 'txt ' + (cls || ''), m); d.style.position = 'static'; d.style.width = 'auto'; d.style.display = 'inline-block'; d.style.fontSize = sz + 'px'; const l = el('span', 'line', d); l.style.display = 'inline-block'; l.textContent = text; return l.getBoundingClientRect().width; }
function splitN(words, n, sz, cls, maxW) {   // best split of words into n lines (min of the widest line), null if none fits
  if (n === 1) { const w = measureW(words.join(' '), sz, cls); return w <= maxW ? { w, lines: [words.join(' ')] } : null; }
  let best = null;
  for (let i = 1; i <= words.length - (n - 1); i++) {
    const head = words.slice(0, i).join(' '); const hw = measureW(head, sz, cls); if (hw > maxW) break;
    const rest = splitN(words.slice(i), n - 1, sz, cls, maxW); if (!rest) continue;
    const w = Math.max(hw, rest.w); if (!best || w < best.w) best = { w, lines: [head].concat(rest.lines) };
  }
  return best;
}
function fitText(text, sizes, maxW, maxLines, zoneH, cls) {
  const words = []; for (const w of text.split(' ')) { if (/^[–—-]$/.test(w) && words.length) words[words.length - 1] += ' ' + w; else words.push(w); }   // a dash never starts a line
  for (const sz of sizes) for (let n = 1; n <= maxLines; n++) {   // largest size first, then the fewest lines at that size
    if (Math.round(sz * 1.04) * n > zoneH) continue;
    const r = splitN(words, n, sz, cls, maxW); if (r) return { size: sz, lines: r.lines };
  }
  FIT_WARNINGS.push('did not fit: ' + text); const sz = sizes[sizes.length - 1];
  const r = splitN(words, maxLines, sz, cls, 1e9) || { lines: [text] }; return { size: sz, lines: r.lines };
}
/* ---------- builders ---------- */
function addText(g, text, zone, t0, tEnd, opts) {
  opts = opts || {}; const cls = opts.cls || '';
  const fit = fitText(text, opts.sizes || F.sizes, 950, opts.maxLines || 3, zone.h, cls);
  const d = el('div', 'txt ' + cls, g); d.style.top = zone.y + 'px'; d.style.fontSize = fit.size + 'px';
  if (zone.align === 'bottom') { const bh = Math.round(fit.size * 1.04) * fit.lines.length; d.style.top = (zone.y + zone.h - bh) + 'px'; }
  const lines = [];
  fit.lines.forEach((ln, i) => {
    const sp = el('span', 'line', d); sp.textContent = ln; lines.push(sp); STRINGS.push(ln);
    const ts = t0 + (opts.delay || 0) + i * .22;
    reg(sp, { o: 0, y: 30, s: .96 }); tw(sp, ts, ts + .55, { o: 1, y: 0, s: 1 }, EOX);
    if (tEnd != null) tw(sp, tEnd - .3, tEnd - .05, { o: 0, y: opts.exitY != null ? opts.exitY : -14 }, EIO);
  });
  STRINGS_FULL.push(text);
  return { div: d, lines, fit };
}
const STRINGS_FULL = []; window.STRINGS_FULL = STRINGS_FULL;
function addBand(g, sc, t0, t1) {
  const p = sc.img; const w = 1080, h = F.bandH, top = F.bandTop;
  const band = el('div', 'band', g); band.style.top = top + 'px'; band.style.height = h + 'px';
  const im = el('img', 'sharp', band); im.src = sc.file; im.dataset.photo = sc.photo;
  const s = Math.max(w / p.w, h / p.h); const bw = p.w * s, bh = p.h * s; const ax = (sc.anchor || [.5, .5])[0], ay = (sc.anchor || [.5, .5])[1];
  im.style.width = bw.toFixed(3) + 'px'; im.style.height = bh.toFixed(3) + 'px'; im.style.left = ((w - bw) / 2).toFixed(3) + 'px'; im.style.top = ((h - bh) / 2).toFixed(3) + 'px';
  im.style.transformOrigin = (ax * 100).toFixed(2) + '% ' + (ay * 100).toFixed(2) + '%'; im.dataset.cover = s.toFixed(4);
  const zf = sc.zoom ? sc.zoom[0] : 1, zt = sc.zoom ? sc.zoom[1] : 1; const dx = (sc.drift || [0, 0])[0], dy = (sc.drift || [0, 0])[1];
  // Ken Burns as a CSS transform about the anchor: sub-pixel positions every frame, so the move never steps or freezes
  reg(im, { s: zf, x: 0, y: 0 }); tw(im, t0, t1, { s: zt, x: dx, y: dy }, LIN);
  return band;
}
function addFill(g, sc, t0, t1) {
  const im = el('img', 'fill', g); im.src = sc.fill; reg(im, { s: 1.22 }); tw(im, t0, t1, { s: 1.28 }, LIN);
  el('div', 'vigTop', g); el('div', 'vigBot', g); return im;
}
function buildPhotoScene(sc, i, n) {
  const g = el('div', 'scene', $('scenes')); g.dataset.scene = sc.scene;
  const t0 = sc.t0, t1 = sc.t1; const xf = F.xfade;
  if (i === 0) reg(g, { o: 1 }); else { reg(g, { o: 0 }); tw(g, t0 - xf, t0, { o: 1 }, EIO); }
  const next = S.scenes[i + 1]; const hardOut = next && next.type === 'end';   // the wipe hides the picture; the text leaves just before the sweep reaches it
  tw(g, t1 + (hardOut ? 0 : .02), t1 + (hardOut ? 0 : .02), { o: 0 });
  addFill(g, sc, t0 - xf, t1); addBand(g, sc, t0 - xf, t1);
  const tEnd = hardOut ? next.t0 - F.wipeDur / 2 + .05 : t1;
  if (sc.top) {
    const r = addText(g, sc.top, F.top, t0, tEnd, { cls: 'sale', sizes: F.topSizes, maxLines: 1, delay: .1, exitY: 10 });
    // gold underline bar under the top line, scaleX in from the left
    const lw = measureW(r.fit.lines[0], r.fit.size, 'sale'); const bar = el('div', 'bar', g); bar.style.width = Math.round(lw) + 'px'; bar.style.left = Math.round(540 - lw / 2) + 'px'; bar.style.top = (F.top.y + Math.round(r.fit.size * 1.04) + 14) + 'px';
    reg(bar, { o: 0, sx: 0 }); tw(bar, t0 + .45, t0 + .9, { o: 1, sx: 1 }, EO); if (tEnd != null) tw(bar, tEnd - .3, tEnd - .05, { o: 0 }, EIO);
  }
  if (sc.bottom) addText(g, sc.bottom, F.bottom, t0, tEnd, { delay: sc.top ? .5 : .1, sizes: F.sizes, maxLines: 3 });
  return g;
}
function buildEndScene(sc, i) {
  const g = el('div', 'scene end', $('scenes')); g.dataset.scene = sc.scene;
  const t0 = sc.t0; reg(g, { o: 0 }); tw(g, t0, t0, { o: 1 });
  // logo: real PNG wordmark, scaled by width
  const lg = el('div', 'logo', g); const im = el('img', '', lg); im.src = 'logo_gold.png'; im.style.width = F.logoW + 'px'; lg.style.top = F.logoY + 'px';
  reg(lg, { o: 0, s: .8, y: 20 }); tw(lg, t0 + .1, t0 + .6, { o: 1, s: 1, y: 0 }, EOB);
  if (sc.lines && sc.lines[0]) addText(g, sc.lines[0], F.endLine, t0, null, { delay: .6, sizes: F.endSizes, maxLines: 2 });
  if (sc.lines && sc.lines[1]) {
    const c = el('div', 'cta', g); c.textContent = sc.lines[1]; c.style.fontSize = F.ctaSize + 'px'; c.style.top = F.ctaY + 'px'; STRINGS.push(sc.lines[1]); STRINGS_FULL.push(sc.lines[1]);
    reg(c, { o: 0, s: .85, y: 24, tx: '-50%' }); tw(c, t0 + 1.2, t0 + 1.75, { o: 1, s: 1, y: 0 }, EOB);
  }
  return g;
}
function buildWipe(tMid) {   // full-screen gold sweep from bottom to top, screen fully covered at tMid
  const w = $('wipe'); const d = F.wipeDur; reg(w, { o: 1, y: H + 140 }); tw(w, tMid - d / 2, tMid + d / 2, { y: -(H + 140) }, EIO);
}
async function init(script, fmt) {
  S = script; F = S.formats[fmt]; W = F.w; H = F.h;
  const st = $('stage'); st.style.width = W + 'px'; st.style.height = H + 'px';
  // load every image first so natural sizes are known
  for (const sc of S.scenes) if (sc.type === 'photo') {
    const a = new Image(); a.src = sc.file; await a.decode(); sc.img = { w: a.naturalWidth, h: a.naturalHeight };
    const b = new Image(); b.src = sc.fill; await b.decode();
  }
  const lg = new Image(); lg.src = 'logo_gold.png'; await lg.decode();
  S.scenes.forEach((sc, i) => { const g = sc.type === 'end' ? buildEndScene(sc, i) : buildPhotoScene(sc, i, S.scenes.length); SCENES.push({ sc, g }); });
  const endSc = S.scenes.find(s => s.type === 'end'); if (endSc) buildWipe(endSc.t0);
  seek(0); return true;
}
/* ---------- QA sampling: visible text boxes, sharp-image scales, scene visibility ---------- */
function effOpacity(e) { let o = 1; while (e && e !== document.body) { const cs = getComputedStyle(e); if (cs.visibility === 'hidden' || cs.display === 'none') return 0; o *= parseFloat(cs.opacity || '1'); e = e.parentElement; } return o; }
window.qaSample = function () {
  const out = { t: window.CUR_T, texts: [], imgs: [], scenes: 0, wipe: 0 };
  for (const { g } of SCENES) {
    if (effOpacity(g) < .02) continue; out.scenes++;
    for (const e of g.querySelectorAll('.line, .cta, .logo img, .bar')) { const o = effOpacity(e); if (o < .02) continue; const r = e.getBoundingClientRect(); out.texts.push({ t: e.className === 'bar' ? '[bar]' : (e.tagName === 'IMG' ? '[logo]' : e.textContent), x0: r.left, y0: r.top, x1: r.right, y1: r.bottom, o: +o.toFixed(2) }); }
    for (const im of g.querySelectorAll('img.sharp')) { const r = im.getBoundingClientRect(); out.imgs.push({ photo: im.dataset.photo, scale: +(r.width / im.naturalWidth).toFixed(4) }); }
  }
  const wr = $('wipe').getBoundingClientRect(); out.wipe = (wr.bottom > 0 && wr.top < H) ? 1 : 0;
  return out;
};
window.ready = (async () => { await document.fonts.load('900 100px Outfit'); await document.fonts.load('800 60px Outfit'); await document.fonts.ready; return true; })();
</script>
</body>
</html>
